name: Pull Request CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: python preprocess.py

      - name: Train model
        run: python train.py

      - name: Run linting
        run: flake8 preprocess.py train.py evaluate.py app tests

      - name: Run tests
        run: pytest

